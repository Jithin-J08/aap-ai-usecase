---
- name: Check if RHEL VM is up to date
  hosts: 10.2.2.135
  become: true
  gather_facts: false
  tasks:

    - name: Test outbound HTTPS connectivity
      ansible.builtin.uri:
        url: https://www.redhat.com
        method: GET
        return_content: no
        timeout: 10
      register: internet_check
      ignore_errors: yes

    - name: Report internet status
      ansible.builtin.debug:
        msg: >
          {% if internet_check.status is defined %}
            ✅ Internet is reachable (HTTP {{ internet_check.status }})
          {% else %}
            ❌ No internet connectivity or blocked by proxy/firewall
          {% endif %}
  
    - name: Check for available package updates
      command: yum check-update
      register: yum_update
      ignore_errors: true

    - name: Set patch_needed fact
      set_fact:
        patch_needed: "{{ 'yes' if yum_update.rc == 100 else 'no' }}"
      # yum check-update returns 100 if updates are available, 0 if not

    - name: Print patch status
      debug:
        msg: >
          System {{ inventory_hostname }} is {{
          'NOT up-to-date, patching required' if patch_needed == 'yes'
          else 'already up-to-date' }}.
